name: Release

# Build desktop HegiKetok untuk macOS, Linux, Windows saat push tag vX.Y.Z.
# macOS dikemas oleh scripts/release_macos.sh (tanda tangan ad-hoc secara
# bawaan). Nama aset `HegiKetok-<versi>-macos.dmg` dipakai updater dalam app,
# jadi jangan diubah tanpa menyesuaikan pickMacAsset().

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Build release + tanda tangan + kemas (.dmg/.zip) + SHA256SUMS.
      # Bawaan: ad-hoc. Untuk Developer ID + notarisasi, impor sertifikat ke
      # keychain runner lalu set SIGN_IDENTITY / NOTARY_PROFILE (DISTRIBUTION.md).
      - name: Build, sign & package
        run: SKIP_CHECKS=1 ./scripts/release_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HegiKetok-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf HegiKetok-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: HegiKetok-linux
          path: HegiKetok-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath HegiKetok-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HegiKetok-windows
          path: HegiKetok-windows-x64.zip

  release:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            HegiKetok-macos/*.dmg
            HegiKetok-macos/*.zip
            HegiKetok-macos/SHA256SUMS.txt
            HegiKetok-linux/HegiKetok-linux-x64.tar.gz
            HegiKetok-windows/HegiKetok-windows-x64.zip
